mode: ultralytics_model
project:
  root: ../..
  python_paths: []
run:
  root: ./vtools/model_diagnostics/runs
  name: auto
dataset:
  data: null
  split: val
predictions_file:
  name: existing_predictions
  predictions: data/predictions.json
  pred_format: auto
ultralytics_model:
  name: ultralytics_pt
  weights: null
  task: detect
custom_adapter:
  name: custom_adapter
  weights: weights/best.pt
  adapter: adapters/my_detector.py
  task: detect
benchmark:
  device: auto
  input_size:
  - 832
  - 832
  batch_size: 1
  precision: fp32
  warmup: 0
  repeats: 1
  fuse: false
  conf: 0.001
  iou: 0.7
  max_det: 3000
modules:
  predict.generate: true
  validation.ultralytics: false
  diagnostics.missed: true
  diagnostics.classification: true
  diagnostics.background: true
  diagnostics.duplicate: true
  diagnostics.localization: true
  diagnostics.overlap: true
  diagnostics.groups: true
  diagnostics.threshold_sweep: false  # 仅用于 FP/图预算；常规阈值曲线使用 Ultralytics val
  diagnostics.bootstrap: false
  diagnostics.stage_comparison: false
  output.bad_cases: true
  output.images: false
  output.html: false
diagnostics:
  score_threshold: 0.25
  candidate_threshold: 0.001
  match_iou: 0.5
  candidate_iou_thresholds:
  - 0.3
  - 0.5
  - 0.75
  score_sweep:
  - 0.001
  - 0.01
  - 0.03
  - 0.05
  - 0.1
  - 0.2
  - 0.3
  - 0.5
  - 0.7
  - 0.9
  fp_budgets_per_image:
  - 0.1
  - 0.5
  - 1.0
  - 2.0
  - 5.0
  localization_iou_floor: 0.1
  short_side_bins:
  - 0
  - 8
  - 16
  - 32
  - 64
  - inf
  density_bins:
  - 0
  - 1
  - 4
  - 8
  - inf
  bootstrap_images: 0
  seed: 0
  overlap:
    iou_threshold: 0.3
    smaller_area_threshold: 0.7
    criterion: either
    class_scope: all
  bad_cases:
    top_k: 50
mode_b:
  task: classify
