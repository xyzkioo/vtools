# 通用目标检测诊断配置（PyCharm 入口）
#
# 运行方式：
#   1. 只修改下面的 mode 和对应 mode_a/mode_b/mode_c；
#   2. 修改 dataset.data；
#   3. 在 PyCharm 中直接运行 ../run_model_diagnostics.py。
#
# A、B、C 三选一。一份配置只运行一个模式，不再使用 models[].enabled 切换。

# ==================== 模式选择 ====================
# A：已有预测文件，不加载模型
# B：使用 Ultralytics .pt 自动逐图预测
# C：使用自定义 vtools 风格 adapter 自动逐图预测
mode: B

# ==================== 公共项目设置 ====================
project:
  # . 表示当前 model_diagnostics 文件夹；也可以写项目绝对路径。
  root: ../..

  # 模式 B 使用本地修改版 Ultralytics 时填写。
  # 如果环境中直接 pip install ultralytics，可保持注释。
  # ultralytics_repo: /home/xxx/PycharmProjects/lichiflower/ultralytics

  # 模式 C 的 adapter 依赖其他源码目录时，可在这里添加。
  python_paths: []

run:
  # 每次运行自动创建 runs/run1、runs/run2……，不会覆盖旧结果。
  root: ./vtools/model_diagnostics/runs
  name: auto

# ==================== 数据集（A/B/C 共用） ====================
dataset:
  # 推荐填写 Ultralytics data.yaml，里面包含 path/train/val/test/names。
  data: null
  split: val

  # 如果不使用 data.yaml，才填写旧式 GT：
  # gt: data/gt.json
  # gt_format: auto
  # images: data/images

# ==================== 模式 A：已有预测文件 ====================
# 只在 mode: A 时读取这一节。
mode_a:
  name: existing_predictions
  predictions: data/predictions.json
  pred_format: auto

# ==================== 模式 B：Ultralytics .pt ====================
# 只在 mode: B 时读取这一节。
mode_b:
  name: ultralytics_pt
  weights: null
  task: detect

# ==================== 模式 C：自定义 Adapter ====================
# 只在 mode: C 时读取这一节。
# adapter 需要实现 vtools 约定的 build_model/predict/
# postprocess_detections 等函数；模板位于 adapters/。
mode_c:
  name: custom_adapter
  weights: weights/best.pt
  adapter: adapters/my_detector.py
  task: detect

# ==================== 推理公共参数 ====================
# B/C 会把这些参数传给模型；A 不加载模型，但仍使用诊断阈值。
benchmark:
  device: auto                 # auto、cpu、cuda:0 或 0
  input_size: [832, 832]       # [height, width]
  batch_size: 1
  precision: fp32              # fp32、fp16、bf16
  warmup: 0
  repeats: 1
  fuse: false
  conf: 0.001
  iou: 0.70
  max_det: 3000

# 每个分析/输出功能独立开关。PyCharm 和终端入口使用同一组模块 ID。
# 常规 mAP/Precision/Recall 等验证由 Ultralytics 提供，本诊断默认不重复执行。
modules:
  predict.generate: true       # B/C 模式生成一次可复用预测；A 模式应关闭
  validation.ultralytics: false
  diagnostics.missed: true
  diagnostics.classification: true
  diagnostics.background: true
  diagnostics.duplicate: true
  diagnostics.localization: true
  diagnostics.overlap: true
  diagnostics.groups: true
  diagnostics.threshold_sweep: false
  diagnostics.bootstrap: false
  diagnostics.stage_comparison: false
  output.bad_cases: true
  output.images: false
  output.html: false

# ==================== 诊断参数 ====================
diagnostics:
  score_threshold: 0.25
  candidate_threshold: 0.001
  match_iou: 0.5
  candidate_iou_thresholds: [0.3, 0.5, 0.75]
  # AP/mAP 阈值不在这里配置，常规验证由 Ultralytics 原生 val 负责。
  # 只有显式开启 diagnostics.threshold_sweep 时才读取下面的阈值扫描。
  score_sweep: [0.001, 0.01, 0.03, 0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 0.9]
  fp_budgets_per_image: [0.1, 0.5, 1.0, 2.0, 5.0]
  localization_iou_floor: 0.1
  short_side_bins: [0, 8, 16, 32, 64, "inf"]
  density_bins: [0, 1, 4, 8, "inf"]
  bootstrap_images: 0
  seed: 0
  overlap:
    iou_threshold: 0.30
    smaller_area_threshold: 0.70
    criterion: either       # either / both / iou / smaller_area
    class_scope: all        # all / same
  bad_cases:
    top_k: 50
