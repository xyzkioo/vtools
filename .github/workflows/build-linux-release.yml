name: Build Linux release package
on:
  push:
    branches: ['build/v0.5.13-linux']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Qt runtime libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libpulse0 xvfb xauth
      - name: Build frontend
        run: |
          npm ci --prefix vtools_ui/webapp/frontend
          npm run build --prefix vtools_ui/webapp/frontend
      - name: Build vtools Debian package and verify installation files
        run: |
          python -m pip install 'pyinstaller==6.22.3' 'PySide6==6.8.3' -r vtools_ui/requirements.txt -r packaging/requirements-bundled-tools.txt
          python packaging/build_desktop.py --clean
          python packaging/build_deb.py
          package=dist/vtools_0.5.13_amd64.deb
          test "$(dpkg-deb -f "$package" Package)" = vtools
          test "$(dpkg-deb -f "$package" Version)" = 0.5.13
          test "$(dpkg-deb -f "$package" Architecture)" = amd64
          dpkg-deb -x "$package" "$RUNNER_TEMP/extracted"
          bundle="$RUNNER_TEMP/extracted/opt/vtools"
          cmp vtools_runtime/input_bundle.py "$bundle/_internal/tool-sources/vtools_runtime/input_bundle.py"
          VTOOLS_USER_DATA="$RUNNER_TEMP/vtools-data" timeout 65 xvfb-run -a "$bundle/vtools" --install-check
          cd dist
          sha256sum vtools_0.5.13_amd64.deb > vtools_0.5.13_amd64.deb.sha256
          stat -c '%n %s bytes' vtools_0.5.13_amd64.deb
          cat vtools_0.5.13_amd64.deb.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/vtools_0.5.13_amd64.deb
            dist/vtools_0.5.13_amd64.deb.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload verified Debian assets to the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release=$(gh api repos/"$GH_REPO"/releases/456306556)
          test "$(jq -r .draft <<< "$release")" = true
          url=$(jq -r '.upload_url | split("{")[0]' <<< "$release")
          cd dist
          sha256sum -c vtools_0.5.13_amd64.deb.sha256
          for file in vtools_0.5.13_amd64.deb vtools_0.5.13_amd64.deb.sha256; do
            hash="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
            bytes=$(stat -c '%s' "$file")
            asset=$(curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Content-Type: application/octet-stream' --data-binary @"$file" \
              "$url?name=$file")
            jq -e --arg digest "$hash" --argjson size "$bytes" \
              '.state == "uploaded" and .digest == $digest and .size == $size' <<< "$asset"
          done
