# 通用模型可视化配置。相对路径相对于 project.root。
schema_version: 1
mode: visualize                 # list_layers 或 visualize

project:
  root: ../..
  ultralytics_repo: ultralytics-cn

model:
  adapter: ultralytics
  weights: /path/to/best.pt
  task: detect
  device: auto                  # auto、cpu、cuda:0 或 0
  precision: fp32               # fp32、fp16；CAM 固定使用 FP32 解释前向
  fuse: false

input:
  source: /path/to/image_or_directory
  dataset_root: null             # 非标准 images/ 布局时填写；须与诊断 data.yaml 的 path 一致
  size: [832, 832]              # [height, width]；首版固定方形 letterbox
  max_images: 10                # null 表示处理全部图片

modules:
  visualization.features: true
  visualization.cam: false
  visualization.stage_trace: false

layers:
  # detect_inputs 自动捕获检测头进入的 P2/P3/P4/P5 特征；也可以写模块名列表。
  preset: detect_inputs
  modules: []                   # 例如 ["model.16", "model.19"]

features:
  enabled: true
  channels:
    mode: first                 # first、variance、explicit
    count: 16
    indices: []
  aggregation: mean_abs         # mean_abs、mean、max
  overlay: true
  save_arrays: false
  statistics: true

cam:
  enabled: false
  method: layercam               # gradcam 或 layercam
  max_targets: 1
  target:
    kind: raw_candidate          # raw_candidate、final_detection
    selection: highest_score
    index: null                  # 显式候选索引；为空时按 selection 选择
    class_id: null

detection:
  conf: 0.001
  iou: 0.70
  max_det: 300

stage_trace:
  enabled: false
  branch: auto                   # auto、one2one、one2many
  save_raw: true
  export_canonical: true
  display_conf: 0.25             # 只影响图像显示，不删除 raw 记录

run:
  root: model_visualization/runs
  name: auto
